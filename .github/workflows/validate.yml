name: Validate
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan of full history
        run: >-
          docker run --rm -v "$PWD:/repo:ro"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --no-banner --redact
      - name: Shell syntax
        run: |
          bash -n scripts/aiws.sh
          bash -n scripts/setup-wsl-ssh.sh
          bash -n scripts/test-aiws.sh
      - name: ShellCheck
        run: shellcheck scripts/*.sh
      - name: PowerShell analysis
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Scope CurrentUser
          $issues = Invoke-ScriptAnalyzer -Path scripts -Recurse -Severity Error
          $issues
          if ($issues) { exit 1 }
      - name: CLI fixture tests
        run: bash scripts/test-aiws.sh
      - name: Panel tests
        run: python -m unittest discover -s panel
      - name: Python syntax
        run: python -m py_compile scripts/check-ml.py ml/smoke-train.py panel/server.py
      - name: Compose schema without real secrets
        env:
          WEBUI_SECRET_KEY: ci_dummy_not_a_real_secret
        run: docker compose -f compose.yaml config --quiet
