name: home-ai-workstation

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  ollama:
    image: ollama/ollama:${OLLAMA_TAG:-0.40.14@sha256:ebaef4f4c5d93660e1f25f8ad085a112f51ccfb0e8458073e71793959dba91c9}
    restart: unless-stopped
    logging: *default-logging
    environment:
      OLLAMA_KEEP_ALIVE: "5m"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_CONTEXT_LENGTH: "16384"
    volumes:
      - ollama_data:/root/.ollama
    # Loopback only, for local editor integrations. Ollama has no authentication,
    # so never bind this to 0.0.0.0 or forward it through Tailscale.
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    # The NVIDIA device reservation is supported in modern Docker Compose.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - ai_internal

  open-webui:
    image: ghcr.io/open-webui/open-webui:${OPEN_WEBUI_TAG:-v0.13.0@sha256:2272b0fb7c8783a016bcc179abb467cfa34590c99c5e6560fe0e9155b4820a09}
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - ollama
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      WEBUI_AUTH: "True"
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?Run 'bash scripts/aiws.sh init' before starting}
    ports:
      - "127.0.0.1:${OPEN_WEBUI_PORT:-3000}:8080"
    volumes:
      - open_webui_data:/app/backend/data
    networks:
      - ai_internal

  # Optional agent with its own web UI. Starts only with: bash scripts/aiws.sh hermes up
  hermes:
    image: nousresearch/hermes-agent:${HERMES_TAG:-v0.23.2@sha256:d6746a084e9341baada483e3d6210444d3c1aeb7c130f0915150065fb2851459}
    profiles: ["hermes"]
    restart: unless-stopped
    logging: *default-logging
    command: ["gateway", "run"]
    environment:
      HERMES_DASHBOARD: "1"
    # Commands run inside this container, which holds only its own data volume:
    # no project folder, no secrets from the host, no Docker socket.
    volumes:
      - hermes_data:/opt/data
    # Loopback only. The dashboard and the web app refuse to start without a
    # password, which bash scripts/aiws.sh hermes password sets.
    ports:
      - "127.0.0.1:${HERMES_DASHBOARD_PORT:-9119}:9119"
      - "127.0.0.1:${HERMES_WEBAPP_PORT:-9120}:9120"
    shm_size: "1g"
    mem_limit: "3g"
    networks:
      - ai_internal

networks:
  ai_internal:
    driver: bridge

volumes:
  ollama_data:
  open_webui_data:
  hermes_data:
